<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Report Item | FindBack</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head> <body>
<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        Find<span>Back</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a
            href="report.html"
            class="active"
        >
            Report Item
        </a>

        <a href="search.html">
            Search
        </a>

    </nav>

</header>


<!-- REPORT FORM -->

<main class="form-page">

    <section class="page-heading">

        <p class="eyebrow">
            CREATE REPORT
        </p>

        <h1>
            Report an Item
        </h1>

        <p>
            Provide details about the item to
            help us find a potential match.
        </p>

    </section>


    <form id="itemForm">


        <!-- REPORT TYPE -->

        <div class="form-group">

            <label for="type">
                REPORT TYPE
            </label>

            <select
                id="type"
                required
            >

                <option value="lost">
                    I Lost This Item
                </option>

                <option value="found">
                    I Found This Item
                </option>

            </select>

        </div>


        <!-- NAME + CATEGORY -->

        <div class="form-grid">

            <div class="form-group">

                <label for="itemName">
                    ITEM NAME
                </label>

                <input
                    id="itemName"
                    type="text"
                    placeholder="Example: Black Wallet"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    CATEGORY
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Wallet">
                        Wallet
                    </option>

                    <option value="Keys">
                        Keys
                    </option>

                    <option value="Documents">
                        Documents
                    </option>

                    <option value="Bag">
                        Bag
                    </option>

                    <option value="Clothing">
                        Clothing
                    </option>

                    <option value="Jewellery">
                        Jewellery
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="description">
                DESCRIPTION
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe the item and any identifying features..."
                required
            ></textarea>

        </div>


        <!-- COLOR + LOCATION -->

        <div class="form-grid">

            <div class="form-group">

                <label for="color">
                    COLOR
                </label>

                <input
                    id="color"
                    type="text"
                    placeholder="Example: Black"
                >

            </div>


            <div class="form-group">

                <label for="location">
                    LOCATION
                </label>

                <input
                    id="location"
                    type="text"
                    placeholder="Example: College Library"
                    required
                >

            </div>

        </div>


        <!-- DATE -->

        <div class="form-group">

            <label for="date">
                DATE
            </label>

            <input
                id="date"
                type="date"
                required
            >

        </div>


        <!-- IMAGE -->

        <div class="form-group">

            <label for="image">
                ITEM IMAGE
            </label>

            <input
                id="image"
                type="file"
                accept="image/png, image/jpeg, image/webp"
            >

            <small>
                Optional. JPG, PNG or WEBP recommended.
            </small>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="primary-btn full"
        >
            Submit Report
        </button>


        <!-- MESSAGE -->

        <div
            id="formMessage"
            class="form-message"
        ></div>

    </form>

</main>


<!-- FOOTER -->

<footer>

    <p>
        FindBack — Cloud-Based Lost & Found System
    </p>

</footer>


<script src="script.js"></script>

</body> </html>
