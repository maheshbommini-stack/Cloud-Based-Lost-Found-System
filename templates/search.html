<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search | FindBack</title>

<link rel="stylesheet" href="style.css">

</head> <body> <header class="navbar">
<div class="logo">
    Find<span>Back</span>
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="report.html">Report Item</a>
    <a href="search.html" class="active">Search</a>
</nav>

</header> <main class="search-page">
<section class="page-heading">

    <p class="eyebrow">
        FIND SOMETHING
    </p>

    <h1>
        Search Lost & Found Items
    </h1>

    <p>
        Search by item name, location,
        category or description.
    </p>

</section>


<section class="search-box">

    <input
        id="searchInput"
        type="text"
        placeholder="Search item, location or category..."
    >


    <select id="searchType">

        <option value="all">
            All Items
        </option>

        <option value="lost">
            Lost
        </option>

        <option value="found">
            Found
        </option>

    </select>


    <button
        id="searchButton"
        class="primary-btn"
    >
        🔍 Search
    </button>

</section>


<section>

    <div class="results-header">

        <h2>
            Results
        </h2>

        <span id="resultCount">
            0 items
        </span>

    </div>


    <div
        id="searchResults"
        class="reports"
    >

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <h3>
                Search for an item
            </h3>

            <p>
                Enter a keyword to search reports.
            </p>

        </div>

    </div>

</section>

</main> <footer> <p> FindBack — Cloud-Based Lost & Found System </p> </footer> <script src="script.js"></script> </body> </html>
